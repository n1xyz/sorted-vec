stages:
  - check
  - test

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - target/

check:
  stage: check
  image: rust:1.89
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-features

test:
  stage: test
  image: rust:1.89
  script:
    - cargo test --all-features
